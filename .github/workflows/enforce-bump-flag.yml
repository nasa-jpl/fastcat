name: Enforce Version Bump Flag

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - main
      - master

jobs:
  check-pr-description:
    name: Check for bump flag
    runs-on: ubuntu-latest
    steps:
      - name: Verify bump flag in description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -iqE 'bump:(major|minor|patch)'; then
            echo "✅ Version bump flag found."
            exit 0
          else
            echo "❌ Error: PR description must contain bump:major, bump:minor, or bump:patch."
            exit 1
          fi